name: Build Windows App

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # NODE
      # ------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # FRONTEND
      # ------------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci

      # ------------------------------------------------------
      # WINDOWS RUNTIME DIRECTORIES
      # ------------------------------------------------------

      - name: Prepare Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtime = "windows-runtime"
          $python = "$runtime\python"

          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          New-Item -ItemType Directory -Force -Path "$runtime\pipeline" | Out-Null
          New-Item -ItemType Directory -Force -Path "$runtime\ffmpeg" | Out-Null
          New-Item -ItemType Directory -Force -Path "$runtime\whisper-model" | Out-Null
          New-Item -ItemType Directory -Force -Path "$runtime\node" | Out-Null
          New-Item -ItemType Directory -Force -Path "$runtime\caption-renderer" | Out-Null
          New-Item -ItemType Directory -Force -Path $python | Out-Null

          Write-Host "Windows runtime directories ready."

          Write-Host ""
          Write-Host "Node version:"
          node --version

          Write-Host ""
          Write-Host "npm version:"
          npm --version

      # ------------------------------------------------------
      # PORTABLE NODE
      # ------------------------------------------------------

      - name: Bundle portable Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nodePath = (Get-Command node).Source

          if (-not (Test-Path $nodePath)) {
            throw "Node executable was not found."
          }

          Write-Host "Build Node executable:"
          Write-Host $nodePath

          Copy-Item `
            $nodePath `
            "windows-runtime/node/node.exe" `
            -Force

          if (-not (Test-Path "windows-runtime/node/node.exe")) {
            throw "Portable Node executable was not copied."
          }

          Write-Host ""
          Write-Host "Portable Node:"
          Get-Item "windows-runtime/node/node.exe"

      # ------------------------------------------------------
      # PYTHON RUNTIME
      # ------------------------------------------------------

      - name: Prepare Windows Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtime = "windows-runtime"
          $python = "$runtime\python"

          Write-Host "Creating Windows Python virtual environment..."

          python -m venv $python

          & "$python\Scripts\python.exe" -m pip install --upgrade pip

          & "$python\Scripts\python.exe" -m pip install `
            "faster-whisper==1.2.1" `
            "yt-dlp==2026.8.19"

          Write-Host "Windows Python runtime ready."

      # ------------------------------------------------------
      # PIPELINE FILES
      # ------------------------------------------------------

      - name: Prepare pipeline files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pipeline = "windows-runtime/pipeline"

          $required = @(
            "$pipeline/pipeline_runner.py",
            "$pipeline/story_event_map.py",
            "$pipeline/generation_selector.py",
            "$pipeline/render_clips_simple.py",
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required bundled pipeline file missing: $file"
            }
          }

          Copy-Item `
            "whisper_transcribe.py" `
            "$pipeline/whisper_transcribe.py" `
            -Force

          Write-Host "Bundled pipeline files:"
          Get-ChildItem $pipeline

      # ------------------------------------------------------
      # REMOTION CAPTION RENDERER
      # ------------------------------------------------------

      - name: Prepare Remotion caption renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $renderer = "windows-runtime/caption-renderer"
          $themes = "windows-runtime/caption-renderer/remotion-captions-themes"

          New-Item -ItemType Directory -Force -Path $renderer | Out-Null
          New-Item -ItemType Directory -Force -Path $themes | Out-Null

          # Copy renderer source.
          Copy-Item `
            "snip-caption-renderer/src" `
            "$renderer/src" `
            -Recurse `
            -Force

          # Copy renderer package files.
          Copy-Item `
            "snip-caption-renderer/package.json" `
            "$renderer/package.json" `
            -Force

          # Copy the actual caption theme source package.
          Copy-Item `
            "remotion-captions-themes/src" `
            "$themes/src" `
            -Recurse `
            -Force

          Copy-Item `
            "remotion-captions-themes/package.json" `
            "$themes/package.json" `
            -Force

          Write-Host ""
          Write-Host "Renderer source:"
          Get-ChildItem "$renderer/src"

          Write-Host ""
          Write-Host "Theme source:"
          Get-ChildItem "$themes/src" -Recurse

      # ------------------------------------------------------
      # INSTALL REMOTION RUNTIME
      # ------------------------------------------------------

      - name: Install Windows Remotion dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $renderer = Resolve-Path "windows-runtime/caption-renderer"
          $package = Join-Path $renderer "package.json"

          $data = Get-Content $package -Raw | ConvertFrom-Json

          if (-not $data.dependencies) {
            $data | Add-Member `
              -MemberType NoteProperty `
              -Name dependencies `
              -Value ([pscustomobject]@{})
          }

          # Replace the Linux development-time local path
          # with the bundled Windows runtime theme package.
          $data.dependencies."remotion-captions-themes" = "file:./remotion-captions-themes"

          $data | ConvertTo-Json -Depth 20 | Set-Content $package

          Write-Host ""
          Write-Host "Renderer package:"
          Get-Content $package

          Push-Location $renderer

          Write-Host ""
          Write-Host "Installing Windows Remotion dependencies..."

          npm install --omit=dev

          Write-Host ""
          Write-Host "Installed production renderer dependencies:"
          npm ls --omit=dev --depth=0

          Pop-Location

      # ------------------------------------------------------
      # VERIFY REMOTION RUNTIME
      # ------------------------------------------------------

      - name: Verify Remotion runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $node = "windows-runtime/node/node.exe"
          $renderer = "windows-runtime/caption-renderer"

          $checks = @(
            $node,
            "$renderer/src/render.ts",
            "$renderer/src/CaptionComposition.tsx",
            "$renderer/src/Root.tsx",
            "$renderer/package.json",
            "$renderer/node_modules/tsx/dist/cli.mjs",
            "$renderer/node_modules/remotion/package.json",
            "$renderer/node_modules/@remotion/renderer/package.json",
            "$renderer/node_modules/@remotion/bundler/package.json",
            "$renderer/node_modules/remotion-captions-themes/src/registry.ts"
          )

          foreach ($file in $checks) {
            if (-not (Test-Path $file)) {
              throw "Remotion runtime verification failed. Missing: $file"
            }
          }

          Write-Host ""
          Write-Host "Node:"
          & $node --version

          Write-Host ""
          Write-Host "tsx:"
          & $node "$renderer/node_modules/tsx/dist/cli.mjs" --version

          Write-Host ""
          Write-Host "Remotion runtime verified."

          Write-Host ""
          Write-Host "Renderer size:"
          Get-ChildItem $renderer -Recurse -File |
            Measure-Object Length -Sum

      # ------------------------------------------------------
      # FFMPEG
      # ------------------------------------------------------

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install `
            --id Gyan.FFmpeg.Shared `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Locate and bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for ffmpeg.exe..."

          $ffmpeg = Get-ChildItem `
            -Path "C:\Program Files","C:\Users\runneradmin\AppData\Local" `
            -Filter "ffmpeg.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found."
          }

          Write-Host "Searching for ffprobe.exe..."

          $ffprobe = Get-ChildItem `
            -Path "C:\Program Files","C:\Users\runneradmin\AppData\Local" `
            -Filter "ffprobe.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ffprobe) {
            throw "ffprobe.exe was not found."
          }

          Copy-Item `
            $ffmpeg.FullName `
            "windows-runtime/ffmpeg/ffmpeg.exe" `
            -Force

          Copy-Item `
            $ffprobe.FullName `
            "windows-runtime/ffmpeg/ffprobe.exe" `
            -Force

          Write-Host "Bundled FFmpeg:"
          Get-ChildItem "windows-runtime/ffmpeg"

      # ------------------------------------------------------
      # WHISPER MODEL
      # ------------------------------------------------------

      - name: Download Whisper base model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $python = Resolve-Path `
            "windows-runtime/python/Scripts/python.exe"

          $modelRoot = `
            (Resolve-Path "windows-runtime/whisper-model").Path

          $env:SNIP_MODEL_ROOT = $modelRoot

          @"
          import os
          import shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download

          root = Path(os.environ["SNIP_MODEL_ROOT"]).resolve()
          cache_dir = root / "cache"

          print("Downloading faster-whisper base model...")
          print(f"Cache: {cache_dir}")

          snapshot_path = snapshot_download(
              repo_id="Systran/faster-whisper-base",
              cache_dir=str(cache_dir),
          )

          snapshot = Path(snapshot_path).resolve()

          print(f"Downloaded model snapshot: {snapshot}")

          model_dir = root / "model"

          if model_dir.exists():
              shutil.rmtree(model_dir)

          model_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          for item in snapshot.iterdir():
              destination = model_dir / item.name

              if item.is_dir():
                  shutil.copytree(
                      item,
                      destination,
                      dirs_exist_ok=True,
                  )
              else:
                  shutil.copy2(
                      item,
                      destination,
                  )

          print("Bundled model directory:")
          print(model_dir)

          required = [
              "config.json",
              "model.bin",
          ]

          for name in required:
              path = model_dir / name

              if not path.exists():
                  raise RuntimeError(
                      f"Required Whisper model file missing: {path}"
                  )

          print("Whisper base model verified.")
          "@ | Set-Content `
            "windows-runtime/download_model.py"

          & $python "windows-runtime/download_model.py"

          Remove-Item `
            "windows-runtime/download_model.py" `
            -Force

          if (Test-Path "windows-runtime/whisper-model/cache") {
            Remove-Item `
              "windows-runtime/whisper-model/cache" `
              -Recurse `
              -Force
          }

          Write-Host "Final Whisper model contents:"
          Get-ChildItem `
            "windows-runtime/whisper-model/model" `
            -Recurse |
            Select-Object FullName

      # ------------------------------------------------------
      # VERIFY COMPLETE WINDOWS RUNTIME
      # ------------------------------------------------------

      - name: Verify Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $python = `
            "windows-runtime/python/Scripts/python.exe"

          $checks = @(
            $python,
            "windows-runtime/node/node.exe",
            "windows-runtime/ffmpeg/ffmpeg.exe",
            "windows-runtime/ffmpeg/ffprobe.exe",
            "windows-runtime/pipeline/pipeline_runner.py",
            "windows-runtime/pipeline/story_event_map.py",
            "windows-runtime/pipeline/generation_selector.py",
            "windows-runtime/pipeline/render_clips_simple.py",
            "windows-runtime/pipeline/whisper_transcribe.py",
            "windows-runtime/whisper-model/model/config.json",
            "windows-runtime/whisper-model/model/model.bin",
            "windows-runtime/caption-renderer/src/render.ts",
            "windows-runtime/caption-renderer/node_modules/tsx/dist/cli.mjs",
            "windows-runtime/caption-renderer/node_modules/remotion/package.json",
            "windows-runtime/caption-renderer/node_modules/@remotion/renderer/package.json",
            "windows-runtime/caption-renderer/node_modules/remotion-captions-themes/src/registry.ts"
          )

          foreach ($file in $checks) {
            if (-not (Test-Path $file)) {
              throw "Runtime verification failed. Missing: $file"
            }
          }

          & $python -c "import faster_whisper; print('faster-whisper: OK')"

          & $python -c "import yt_dlp; print('yt-dlp: OK')"

          & $python -c "from faster_whisper import WhisperModel; print('WhisperModel: OK')"

          & "windows-runtime/node/node.exe" `
            "windows-runtime/caption-renderer/node_modules/tsx/dist/cli.mjs" `
            --version

          Write-Host ""
          Write-Host "===== WINDOWS RUNTIME READY ====="
          Write-Host ""

          $runtimeSize = Get-ChildItem `
            windows-runtime `
            -Recurse `
            -File |
            Measure-Object Length -Sum

          Write-Host "Runtime bytes: $($runtimeSize.Sum)"
          Write-Host "Runtime MB: $([math]::Round($runtimeSize.Sum / 1MB, 2))"

      # ------------------------------------------------------
      # BUILD
      # ------------------------------------------------------

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Snip AI v__VERSION__
          releaseBody: |
            Snip AI Windows installer.
          releaseDraft: false
          prerelease: false
